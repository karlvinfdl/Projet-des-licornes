services:
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        volumes:
            - .:/var/www
        depends_on:
            - database
        environment:
            DATABASE_URL: "postgresql://app_user:app_password@database:5432/app_db?serverVersion=16.0&charset=utf8"

    nginx:
        build:
            context: .
            dockerfile: docker/nginx/Dockerfile
        ports:
            - "8080:80"
        volumes:
            - .:/var/www
        depends_on:
            - php

    database:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: app_user
            POSTGRES_PASSWORD: app_password
            POSTGRES_DB: app_db
        volumes:
            - database_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"

    mailer:
        image: axllent/mailpit
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: "1"
            MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        ports:
            - "1025:1025"
            - "8025:8025"

volumes:
    database_data:
